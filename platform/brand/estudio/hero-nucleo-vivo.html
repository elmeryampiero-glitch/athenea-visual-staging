const rnd = (s => () => (s = s*16807 % 2147483647) / 2147483647)(20260802);
const hex = (h,a) => {
  const s = h.replace("#","");
  const b = parseInt(s.length===3 ? s.split("").map(c=>c+c).join("") : s, 16);
  return `rgba(${b>>16&255},${b>>8&255},${b&255},${a})`;

/* Campo de densidad barato y continuo — senos con frecuencias que no encajan */
function densidad(x, y, z){
  const v = Math.sin(x*3.1 + y*1.7 + z*2.3) * 0.50
          + Math.sin(x*5.7 - y*4.1 + z*1.3) * 0.30
          + Math.sin(-x*2.2 + y*6.3 + z*5.1) * 0.20;
  return (v + 1) / 2;
}

/* Muestreo uniforme dentro de un casquete alrededor de un eje unitario */
function enCasquete(ex, ey, ez, alfa){
  const cosA = Math.cos(alfa);
  const u = cosA + (1 - cosA) * rnd();
  const s = Math.sqrt(Math.max(0, 1 - u*u));
  const fi = rnd() * Math.PI * 2;
  const ax = Math.abs(ex) < 0.8 ? 1 : 0, ay = Math.abs(ex) < 0.8 ? 0 : 1;
  let b1x = ay*ez, b1y = -ax*ez, b1z = ax*ey - ay*ex;
  const n1 = Math.hypot(b1x, b1y, b1z) || 1;
  b1x /= n1; b1y /= n1; b1z /= n1;
  const b2x = ey*b1z - ez*b1y, b2y = ez*b1x - ex*b1z, b2z = ex*b1y - ey*b1x;
  const c = Math.cos(fi)*s, d = Math.sin(fi)*s;
  return [ex*u + b1x*c + b2x*d, ey*u + b1y*c + b2y*d, ez*u + b1z*c + b2z*d];
}

/* --- densidad adaptativa: el tamaño del aparato depende del viewport ------- */
function presupuesto(){
  const menor = Math.min(innerWidth, innerHeight);
  // «70–110 nodos luminosos en móvil»: luminoso = tamaño 1 o 2. El resto de
  // puntos menores da cuerpo sin contarse como nodo del grafo.
  if (menor < 620)  return {lum: 96,  menores:185, polvo:760, gasPorArea:5};
  if (menor < 900)  return {lum: 120, menores:225, polvo:920, gasPorArea:6};
  return              {lum: 140, menores:255, polvo:1040, gasPorArea:6};
}

let nodos = [], aristas = [], polvo = [], gas = [], diagonales = [];
let porNodo = [];            // nodo → aristas que lo tocan (para la interacción)

function repartir(P){
  /* Tres decisiones de reparto, y las tres se declaran:
     · los HEMISFERIOS pesan igual (50/50): son estructura, no estadística —
       si «Otras áreas» (2.518 notas) arrastrara su lado, la esfera dejaría
       de ser dos hemisferios y volvería a ser un grumo y un desierto;
     · dentro de cada hemisferio la compresión es potencia 0,34 con tope del
       34 %: el orden se conserva, ningún área borra a sus vecinas;
     · un 15 % de los puntos se riega uniforme por toda la esfera (abajo, en
       construir): es lo que cierra los casquetes polares sin inventar áreas. */
  for (const a of AREAS) a.peso = Math.pow(a.v, 0.34);
  const fam = {p:0, d:0};
  for (const a of AREAS) fam[a.f] += a.peso;
  for (const a of AREAS) a.cuotaFam = Math.min(a.peso / fam[a.f], 0.34);
  const rem = {p:0, d:0};
  for (const a of AREAS) rem[a.f] += a.cuotaFam;
  const total = P.lum + P.menores;
  for (const a of AREAS){
    a.cuota = 0.5 * a.cuotaFam / rem[a.f];
    a.nodos = Math.max(8, Math.round(total * 0.85 * a.cuota));
    a.alfa = Math.acos(Math.max(-1, 1 - 2 * a.cuota * 0.92));
    const sx = a.f === "p" ? -1 : 1;
    const rr = Math.sqrt(Math.max(0, 1 - a.lat*a.lat));
    const giro = (a.lat > 0 ? 1 : -1) * 0.42;
    a.eje = [sx*Math.cos(giro)*rr, a.lat, Math.sin(giro)*rr];
    a.ancla = {x: a.eje[0]*0.98, y: a.eje[1]*0.98, z: a.eje[2]*0.98};
  }
}

function construir(){
  const P = presupuesto();
  nodos = []; aristas = []; polvo = []; gas = []; diagonales = [];
  repartir(P);

  // 1 · nodos: por área, con grumos, vacíos y espesor. La frontera se MEZCLA:
  //     cerca del meridiano se admite pisar el otro lado (|x| < 0.14), porque
  //     el prompt manda hemisferios «mezclados en la frontera» — la regla de
  //     los hemisferios la siguen cumpliendo las masas, no cada grano.
  const cupoLum = P.lum;
  let lumPuestos = 0;
  AREAS.forEach((a, ia) => {
    const [ex, ey, ez] = a.eje;
    const sx = a.f === "p" ? -1 : 1;
    let puestos = 0;
    for (let k = 0; puestos < a.nodos && k < a.nodos*30; k++){
      const [ux, uy, uz] = enCasquete(ex, ey, ez, a.alfa);
      if (Math.sign(ux) !== sx && Math.abs(ux) > 0.14) continue;
      const d = densidad(ux*4.6, uy*4.6, uz*4.6);
      if (rnd() > 0.48 + 0.46*d) continue;
      const dentro = rnd() < 0.20;
      const r = dentro ? 0.40 + rnd()*0.48
                       : 0.94 + (rnd()-0.5)*0.17;
      // tamaño: los luminosos (1 y 2) hasta agotar cupo; después, menores
      let s = 0;
      if (lumPuestos < cupoLum && !dentro && rnd() > 0.44){
        s = rnd() > 0.86 ? 2 : 1; lumPuestos++;
      }
      // en la frontera el color del grano puede tomar el del otro hemisferio
      const frontera = Math.abs(ux) < 0.14;
      const br = frontera ? (rnd() < 0.5 ? 0 : 1) : (a.f === "p" ? 0 : 1);
      nodos.push({x:ux*r, y:uy*r, z:uz*r, br, area:ia, s, f:rnd()*9, dentro, luz:0});
      puestos++;
    }
  });

  // 1b · el rocío uniforme: 15 % de los puntos sobre toda la esfera, sin
  //      casquete. Cada uno se adscribe al área cuyo eje tiene más cerca en
  //      su hemisferio — cierra los polos y las costuras sin inventar masa.
  const rocio = Math.round((P.lum + P.menores) * 0.26);
  for (let i = 0; i < rocio; i++){
    const y = rnd() < 0.35 ? -(0.40 + 0.58*rnd()) : 1 - 2*rnd();
    const rr2 = Math.sqrt(Math.max(0, 1 - y*y));
    const th = rnd() * Math.PI * 2;
    const ux = Math.cos(th)*rr2, uy = y, uz = Math.sin(th)*rr2;
    let mejor = 0, md = 9;
    AREAS.forEach((a, ia) => {
      const sx = a.f === "p" ? -1 : 1;
      if (Math.sign(ux) !== sx && Math.abs(ux) > 0.14) return;
      const dd = (ux-a.eje[0])**2 + (uy-a.eje[1])**2 + (uz-a.eje[2])**2;
      if (dd < md){ md = dd; mejor = ia; }
    });
    const dentro = rnd() < 0.20;
    const r = dentro ? 0.40 + rnd()*0.48 : 0.94 + (rnd()-0.5)*0.17;
    let s = 0;
    if (lumPuestos < cupoLum && !dentro && rnd() > 0.5){
      s = rnd() > 0.86 ? 2 : 1; lumPuestos++;
    }
    nodos.push({x:ux*r, y:uy*r, z:uz*r, br: ux < 0 ? 0 : 1,
                area:mejor, s, f:rnd()*9, dentro, luz:0});
  }

  // 2 · polvo: grano, no grafo — también reparte por peso
  AREAS.forEach(a => {
    const [ex, ey, ez] = a.eje;
    const sx = a.f === "p" ? -1 : 1;
    const cuantos = Math.round(P.polvo * a.cuota);
    for (let i = 0, k = 0; i < cuantos && k < cuantos*8; k++){
      const [ux, uy, uz] = enCasquete(ex, ey, ez, a.alfa * 1.12);
      if (Math.sign(ux) !== sx && Math.abs(ux) > 0.14) continue;
      const d = densidad(ux*4.6, uy*4.6, uz*4.6);
      const r = 0.30 + 0.72*Math.pow(rnd(), 0.42);
      polvo.push({x:ux*r, y:uy*r, z:uz*r, br: a.f === "p" ? 0 : 1,
                  a:(0.10 + 0.30*d) * (0.4 + 0.6*r), t:rnd()*9});
      i++;
    }
  });

  // 3 · gas: materia iluminada dentro de la esfera
  AREAS.forEach(a => {
    const [ex, ey, ez] = a.eje;
    for (let i = 0; i < P.gasPorArea; i++){
      const [ux, uy, uz] = enCasquete(ex, ey, ez, a.alfa * 0.75);
      const r = 0.30 + rnd()*0.55;
      gas.push({x:ux*r, y:uy*r, z:uz*r, br: a.f === "p" ? 0 : 1,
                rad: 0.10 + 0.55*a.alfa*(0.7 + 0.6*rnd()),
                a: 0.036 + 0.042*rnd(), t:rnd()*9});
    }
  });

  // 4 · malla de vecinos: TRES por nodo y poca poda. El estudio insinuaba la
  //     malla; el prompt maestro pide leerla — 140 a 240 conexiones visibles.
  const vistas = new Set();
  const cascara = nodos.map((nd, i) => nd.dentro ? null : i).filter(v => v !== null);
  for (const i of cascara){
    const d = [];
    for (const j of cascara){
      if (i === j) continue;
      d.push([ (nodos[i].x-nodos[j].x)**2 + (nodos[i].y-nodos[j].y)**2
             + (nodos[i].z-nodos[j].z)**2, j ]);
    }
    d.sort((a,b) => a[0]-b[0]);
    // tres vecinos con retención decreciente: la malla queda rica pero dentro
    // de las 140–240 conexiones visibles que fija el prompt maestro
    const reten = [1, 0.80, 0.42];
    for (let k = 0; k < 3; k++){
      if (!d[k] || rnd() > reten[k]) continue;
      const j = d[k][1], clave = i < j ? i+","+j : j+","+i;
      if (vistas.has(clave)) continue;
      vistas.add(clave);
      aristas.push({i, j, cruza:false, curva: d[k][0] > 0.16});
    }
  }

  // 4b · el cupo del gate: entre 140 y 240 conexiones visibles en total.
  //      Si la malla se pasa, se aclara al azar determinista — nunca los
  //      cruces de dominio, que son la parte más valiosa (§59).
  const CUPO_MALLA = SOLO ? 148 : 188;   // incrustada, la carta respira más
  while (aristas.length > CUPO_MALLA){
    const k = Math.floor(rnd()*aristas.length);
    if (aristas[k].cruza) continue;
    aristas.splice(k, 1);
  }

  // 4c · PUENTES: fibras de medio alcance entre regiones vecinas, por la
  //      SUPERFICIE. Son lo que convierte los cúmulos locales en una sola
  //      telaraña — el benchmark no tiene islas. Mismo hemisferio, distancia
  //      media, curvadas sobre la esfera al dibujarse.
  {
    const puentes = [];
    let guardia = 0;
    while (puentes.length < 22 && guardia++ < 900){
      const i = cascara[Math.floor(rnd()*cascara.length)];
      const j = cascara[Math.floor(rnd()*cascara.length)];
      if (i === j || nodos[i].area === nodos[j].area) continue;
      if (nodos[i].br !== nodos[j].br) continue;         // los cruces van aparte
      const dd = (nodos[i].x-nodos[j].x)**2 + (nodos[i].y-nodos[j].y)**2
               + (nodos[i].z-nodos[j].z)**2;
      if (dd < 0.30 || dd > 1.15) continue;              // medio alcance
      const clave = i < j ? i+","+j : j+","+i;
      if (vistas.has(clave)) continue;
      vistas.add(clave);
      puentes.push({i, j, cruza:false, curva:true});
    }
    aristas.push(...puentes);
  }

  // 5 · diagonales internas: relaciones de largo alcance DENTRO del volumen.
  //     Son lo que la fotografía objetivo tiene y la rueda no tenía: cuerdas
  //     que atraviesan la esfera en diagonal, tenues, con curvatura hacia el
  //     interior. Al menos seis no radiales — la prueba lo exige.
  const porArea = AREAS.map(() => []);
  cascara.forEach(i => porArea[nodos[i].area].push(i));
  let intentos = 0;
  while (diagonales.length < 12 && intentos++ < 400){
    const a1 = Math.floor(rnd()*AREAS.length), a2 = Math.floor(rnd()*AREAS.length);
    if (a1 === a2 || !porArea[a1].length || !porArea[a2].length) continue;
    if (AREAS[a1].f !== AREAS[a2].f) continue;          // los cruces van aparte
    const i = porArea[a1][Math.floor(rnd()*porArea[a1].length)];
    const j = porArea[a2][Math.floor(rnd()*porArea[a2].length)];
    const dd = (nodos[i].x-nodos[j].x)**2 + (nodos[i].y-nodos[j].y)**2
             + (nodos[i].z-nodos[j].z)**2;
    if (dd < 0.9) continue;                              // diagonal, no vecino
    const clave = i < j ? i+","+j : j+","+i;
    if (vistas.has(clave)) continue;
    vistas.add(clave);
    diagonales.push({i, j});
  }

  // 6 · cruces entre dominios (§59): lo más luminoso, repartidos por latitud
  const cercaP = [], cercaD = [];
  nodos.forEach((nd, i) => {
    if (nd.dentro) return;
    (nd.br === 0 ? cercaP : cercaD).push([Math.abs(nd.x), i]);
  });
  cercaP.sort((a,b) => a[0]-b[0]); cercaD.sort((a,b) => a[0]-b[0]);
  const cabezaP = cercaP.slice(0, 44).map(v => v[1]);
  const cabezaD = cercaD.slice(0, 44).map(v => v[1]);
  const pares = [];
  for (const i of cabezaP) for (const j of cabezaD)
    pares.push([ (nodos[i].y-nodos[j].y)**2 + (nodos[i].z-nodos[j].z)**2, i, j ]);
  pares.sort((a,b) => a[0]-b[0]);
  const usado = new Set(), porFranja = new Map();
  for (const [, i, j] of pares){
    if (usado.has(i) || usado.has(j)) continue;
    const franja = Math.round((nodos[i].y + nodos[j].y) / 2 * 3.5);
    if ((porFranja.get(franja) || 0) >= 2) continue;
    porFranja.set(franja, (porFranja.get(franja) || 0) + 1);
    usado.add(i); usado.add(j);
    aristas.push({i, j, cruza:true, curva:true});
  }

  // 7 · anclas de rama: cada rama toma los TRES nodos de cáscara más cercanos
  //     a su centro — la ficha se cose a la red, no cuelga de un aro
  AREAS.forEach((a, ia) => {
    const d = [];
    for (const i of cascara)
      if (nodos[i].area === ia)
        d.push([ (nodos[i].x-a.ancla.x)**2 + (nodos[i].y-a.ancla.y)**2
               + (nodos[i].z-a.ancla.z)**2, i ]);
    d.sort((u,v) => u[0]-v[0]);
    a.puntadas = d.slice(0, 3).map(v => v[1]);
  });

  // mapa nodo → aristas, para encender la red alrededor del dedo
  porNodo = nodos.map(() => []);
  aristas.forEach((a, k) => { porNodo[a.i].push(k); porNodo[a.j].push(k); });

  // métricas para el gate de aceptación — las lee la prueba, no el usuario
  if (RAMA !== null) construirRamaViva();

  window.__HERO_METRICS = {
    nodosLuminosos: nodos.filter(n => n.s > 0).length,
    nodosTotales: nodos.length,
    aristasVisibles: aristas.length + diagonales.length,
    cruces: aristas.filter(a => a.cruza).length,
    diagonalesInternas: diagonales.length,
    ramas: AREAS.length,
    ramasEnSegundaOrbita: AREAS.filter(a => a.jer === "orbita2").length,
    planosProfundidad: 3,
  };
}

/* --- el campo de estrellas: TRES planos + nebulosa de baja intensidad ------ */
let estrellas = [], nebulosa = [];
/* LA RAMA EN FOCO ES UN UNIVERSO PROPIO (orden del Director): no un
   recorte del mapa general sino su constelación entera — toda la esfera
   para ella, con densidad proporcional a su PESO real (las notas del
   censo), sus cúmulos, su rocío y su telaraña interna. Viva. */
function construirRamaViva(){
  const a = AREAS[RAMA];
  const br = a.f === "p" ? 0 : 1;
  const peso = Math.pow(a.v, 0.34);
  const lum = Math.max(24, Math.min(66, Math.round(18 + peso*3.2)));
  const menores = Math.round(lum * 2.2);
  // las CONEXIONES reales del grafo gobiernan cuánto se teje esta rama
  const conex = CONEXIONES[a.icon] || 0;
  const factorConex = Math.max(0.5, Math.min(1.6, 0.5 + Math.pow(conex, 0.35)/5.5));
  nodos = []; aristas = []; diagonales = []; gas = [];

  // cúmulos repartidos por TODA la esfera (espiral de Fibonacci)
  const nSem = 5 + Math.min(3, Math.floor(peso/4));
  const semillas = [];
  for (let s = 0; s < nSem; s++){
    const u = (s + 0.5)/nSem*2 - 1;
    const th = s * 2.399963;
    const rr = Math.sqrt(Math.max(0, 1 - u*u));
    semillas.push([Math.cos(th)*rr, u, Math.sin(th)*rr]);
  }
  const total = lum + menores;
  for (let i = 0; i < total; i++){
    let ux, uy, uz;
    if (rnd() < 0.22){                       // rocío uniforme: cierra el cielo
      const y = 1 - 2*rnd(), rr2 = Math.sqrt(Math.max(0, 1 - y*y));
      const th = rnd()*Math.PI*2;
      ux = Math.cos(th)*rr2; uy = y; uz = Math.sin(th)*rr2;
    } else {                                  // cúmulo con espesor orgánico
      const sem = semillas[i % nSem];
      [ux, uy, uz] = enCasquete(sem[0], sem[1], sem[2], 0.52 + rnd()*0.22);
    }
    const dentro = rnd() < 0.16;
    const r = dentro ? 0.42 + rnd()*0.46 : 0.94 + (rnd()-0.5)*0.17;
    const s = i < lum ? (i % 6 === 0 ? 2 : 1) : 0;
    nodos.push({x:ux*r, y:uy*r, z:uz*r, br, area:RAMA, s,
                f:rnd()*9, dentro, luz:0});
  }

  // telaraña interna: cada nodo de cáscara se cose a sus 2 vecinos más
  // cercanos; unos puentes curvos de medio alcance le dan la respiración
  const cascara = nodos.map((n,i)=>i).filter(i => !nodos[i].dentro);
  const vistas = new Set();
  const coser = (i, j, curva) => {
    const clave = i < j ? i+","+j : j+","+i;
    if (i === j || vistas.has(clave)) return;
    vistas.add(clave);
    aristas.push({i, j, cruza:false, curva});
  };
  for (const i of cascara){
    const d = [];
    for (const j of cascara){
      if (i === j) continue;
      d.push([(nodos[i].x-nodos[j].x)**2 + (nodos[i].y-nodos[j].y)**2
            + (nodos[i].z-nodos[j].z)**2, j]);
    }
    d.sort((u,v) => u[0]-v[0]);
    coser(i, d[0][1], false);                       // el esqueleto: 1er vecino
    if (d[1] && d[1][0] < 0.34 && rnd() < 0.42*factorConex)
      coser(i, d[1][1], false);                     // el 2º, según conexiones
  }
  let guardia = 0;
  const puentesMax = Math.round((6 + peso) * factorConex);
  let puestos = 0;
  while (puestos < puentesMax && guardia++ < 700){
    const i = cascara[Math.floor(rnd()*cascara.length)];
    const j = cascara[Math.floor(rnd()*cascara.length)];
    const dd = (nodos[i].x-nodos[j].x)**2 + (nodos[i].y-nodos[j].y)**2
             + (nodos[i].z-nodos[j].z)**2;
    if (dd < 0.35 || dd > 1.25) continue;
    const antes = vistas.size; coser(i, j, true);
    if (vistas.size > antes) puestos++;
  }
  guardia = 0;
  while (diagonales.length < 5 && guardia++ < 300){
    const i = cascara[Math.floor(rnd()*cascara.length)];
    const j = cascara[Math.floor(rnd()*cascara.length)];
    const dd = (nodos[i].x-nodos[j].x)**2 + (nodos[i].y-nodos[j].y)**2
             + (nodos[i].z-nodos[j].z)**2;
    if (i === j || dd < 1.0) continue;
    diagonales.push({i, j});
  }

  // el aliento de la rama: nubes de SU color de familia en cada cúmulo —
  // es lo que hace que la constelación se lea como materia viva, no alambre
  for (const sem of semillas){
    const nNubes = 1 + (rnd() < 0.5 ? 1 : 0);
    for (let q = 0; q < nNubes; q++){
      const [ux, uy, uz] = enCasquete(sem[0], sem[1], sem[2], 0.4);
      const r = 0.72 + rnd()*0.2;
      gas.push({x:ux*r, y:uy*r, z:uz*r, br, rad: 0.24 + rnd()*0.20,
                a: 0.05 + rnd()*0.045, t: rnd()*7});
    }
  }

  // la ficha se cose a sus tres nodos más cercanos, como en el mapa completo
  const d = [];
  for (const i of cascara)
    d.push([(nodos[i].x-a.ancla.x)**2 + (nodos[i].y-a.ancla.y)**2
          + (nodos[i].z-a.ancla.z)**2, i]);
  d.sort((u,v) => u[0]-v[0]);
  a.puntadas = d.slice(0, 3).map(v => v[1]);
  AREAS.forEach((o, i) => { if (i !== RAMA) o.puntadas = []; });

  porNodo = nodos.map(() => []);
  aristas.forEach((ar, k) => { porNodo[ar.i].push(k); porNodo[ar.j].push(k); });
}

function sembrarCielo(){
  estrellas = []; nebulosa = [];
  for (let plano = 0; plano < 3; plano++){
    const n = [300, 130, 48][plano];
    for (let i = 0; i < n; i++) estrellas.push({
      x: rnd(), y: rnd(),
      r: [0.5, 0.9, 1.5][plano] * (0.6 + rnd()*0.8),
      a: [0.16, 0.34, 0.62][plano] * (0.5 + rnd()*0.6),
      t: rnd()*9, vel: 0.4 + rnd()*0.9, plano,
    });
  }
  // nebulosa: manchas anchas y muy tenues alrededor de la esfera y el cielo
  for (let i = 0; i < 11; i++) nebulosa.push({
    x: 0.12 + rnd()*0.76, y: 0.06 + rnd()*0.55,
    rad: 0.16 + rnd()*0.26, br: rnd() < 0.5 ? 0 : 1,
    a: 0.024 + rnd()*0.026, t: rnd()*9,
  });
}

/* --- proyección: perspectiva débil, de donde sale el volumen --------------- */
function proyecta(nd, cs, sn, esc){
  const x =  nd.x*cs + nd.z*sn;
  const z = -nd.x*sn + nd.z*cs;
  const k = FOCO / (FOCO - z) * esc;
  return {X: cx + x*R*k, Y: cy + nd.y*R*k, prof: (z + 1) / 2};
}

/* --- sprites de brillo ----------------------------------------------------- */
const sprite = {};
function hacerSprite(color, radio){
  const k = color + "|" + Math.round(radio*10);
  if (sprite[k]) return sprite[k];
  const c = document.createElement("canvas");
  const r = Math.max(2, radio * 4); c.width = c.height = r*2;
  const x = c.getContext("2d");
  const gr = x.createRadialGradient(r, r, 0, r, r, r);
  gr.addColorStop(0,    hex(MARFIL, 0.95));
  gr.addColorStop(0.15, hex(color, 0.92));
  gr.addColorStop(0.42, hex(color, 0.26));
  gr.addColorStop(1,    hex(color, 0));
  x.fillStyle = gr; x.fillRect(0, 0, r*2, r*2);
  return sprite[k] = c;
}
const nube = {};
function hacerNube(color, radio){
  const k = color + "|" + Math.round(radio/12);
  if (nube[k]) return nube[k];
  const r = Math.max(8, Math.round(radio/12)*12);
  const c = document.createElement("canvas");
  c.width = c.height = r*2;
  const x = c.getContext("2d");
  const gr = x.createRadialGradient(r, r, 0, r, r, r);
  gr.addColorStop(0,    hex(color, 0.55));
  gr.addColorStop(0.30, hex(color, 0.26));
  gr.addColorStop(0.62, hex(color, 0.07));
  gr.addColorStop(1,    hex(color, 0));
  x.fillStyle = gr; x.fillRect(0, 0, r*2, r*2);
  return nube[k] = c;
}

/* --- ZONA D · horizonte: paisaje por capas, amanecer y camino de luz -------
   Pre-renderizado a un lienzo aparte: la cordillera no cambia cuadro a
   cuadro. El pulso del amanecer sí es vivo y se pinta encima en cuadro(). */
let paisaje = null;
function hacerPaisaje(){
  const c = document.createElement("canvas");
  c.width = Math.round(W*dpr); c.height = Math.round(H*dpr);
  const x = c.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const rl = (s => () => (s = s*16807 % 2147483647) / 2147483647)(11);

  // el cielo bajo: se templa hacia el valle, obsidiana con profundidad
  const cieloBajo = x.createLinearGradient(0, horizonY - H*0.16, 0, H);
  cieloBajo.addColorStop(0, hex(COSMOS, 0));
  cieloBajo.addColorStop(0.45, hex(ESPACIO, 0.55));
  cieloBajo.addColorStop(1, hex(COSMOS, 1));
  x.fillStyle = cieloBajo; x.fillRect(0, horizonY - H*0.16, W, H);

  // el amanecer en el valle central — luz localizada, no brillo general
  const albaR = Math.min(W*0.62, H*0.66);   // luz localizada: no escala con pantallas anchas
  const alba = x.createRadialGradient(W/2, horizonY, 2, W/2, horizonY, albaR);
  alba.addColorStop(0,    hex(PRACTICA, 0.55));
  alba.addColorStop(0.14, hex(PRACTICA, 0.26));
  alba.addColorStop(0.40, hex(PRACTICA, 0.07));
  alba.addColorStop(1,    hex(PRACTICA, 0));
  x.fillStyle = alba; x.fillRect(0, 0, W, H);

  // BANCOS DE NUBES: cúmulos a ambos lados del valle, con el vientre
  // encendido por el alba — es lo que da cielo al benchmark, no las estrellas
  for (let i = 0; i < 46; i++){
    const lado = rl() < 0.5 ? -1 : 1;
    const alto = rl() < 0.30;                          // un tercio vuela más alto
    const ux = 0.5 + lado * (alto ? 0.16 + rl()*0.36 : 0.08 + rl()*0.44);
    const uy = horizonY - (alto ? H*0.10 + rl()*H*0.09 : H*0.010 + rl()*H*0.115);
    const w = W*(0.07 + rl()*0.18), h = (alto ? 3.5 : 5) + rl()*14;
    const cerca = Math.max(0.12, 1 - (horizonY - uy)/(H*0.20));
    x.fillStyle = hex("#141127", 0.5 + 0.3*rl());
    x.beginPath(); x.ellipse(ux*W, uy, w, h, 0, 0, 7); x.fill();
    // el vientre encendido: más luz cuanto más cerca del alba (centro y abajo)
    const haciaValle = 1 - Math.min(1, Math.abs(ux - 0.5)/0.5);
    x.fillStyle = hex(PRACTICA, (0.10 + 0.16*rl()) * cerca * (0.45 + 0.55*haciaValle));
    x.beginPath(); x.ellipse(ux*W, uy + h*0.45, w*0.92, h*0.58, 0, 0, 7); x.fill();
  }

  // TRES crestas de cordillera, de lejos a cerca — el paisaje tiene capas
  const crestas = [
    {alto: 0.078, tono: hex("#171331", 1),  borde: hex(PRACTICA, 0.42)},
    {alto: 0.118, tono: hex("#0d0b20", 1),  borde: hex(PRACTICA, 0.22)},
    {alto: 0.160, tono: hex("#070612", 1),  borde: hex(PRACTICA, 0.07)},
  ];
  crestas.forEach((cr, ci) => {
    const base = horizonY + ci*H*0.012;
    x.beginPath(); x.moveTo(0, H);
    let y0 = base;
    for (let px = 0; px <= W; px += 8){
      const u = px/W;
      // el valle queda en el centro: las crestas caen hacia W/2
      const valle = 1 - Math.exp(-((u-0.5)*(u-0.5))/0.028);
      const cresta = ( Math.sin(u*9.1 + ci*7) * 0.45
                     + Math.sin(u*23.7 + ci*3) * 0.3
                     + Math.sin(u*47.3 + ci*13) * 0.25 );
      y0 = base - (cresta*0.5 + 0.5) * H * cr.alto * valle;
      x.lineTo(px, y0);
    }
    x.lineTo(W, H); x.closePath();
    x.fillStyle = cr.tono; x.fill();
    // filo de luz sobre la cresta lejana: el amanecer la recorta
    x.strokeStyle = cr.borde; x.lineWidth = 0.8;
    x.stroke();
  });

  // luces del valle: puntos cálidos escasos entre las crestas
  for (let i = 0; i < 130; i++){
    const u = 0.5 + (rl()-0.5)*0.92;
    const y = horizonY + H*0.010 + rl()*H*0.105;
    const a = 0.07 + rl()*0.28;
    const grande = rl() < 0.14;
    x.fillStyle = hex(PRACTICA, a);
    x.fillRect(u*W, y, grande ? 1.9 : 1.1, 1.1);
    if (grande){                                       // algunas con su halo
      x.fillStyle = hex(PRACTICA, a*0.25);
      x.beginPath(); x.arc(u*W, y, 2.6, 0, 7); x.fill();
    }
  }

  // EL CAMINO DE LUZ: nace en el amanecer y llega al pie con perspectiva.
  // No es una línea aislada: tiene ancho creciente, halo y meandro.
  const meandro = u => Math.sin(u*4.6)*W*0.062*u + Math.sin(u*10.3)*W*0.02*u*u;
  x.lineCap = "round";
  for (const [ancho, alfa] of [[16, 0.05],[8, 0.10],[3.6, 0.22],[1.4, 0.5]]){
    x.beginPath();
    for (let s = 0; s <= 40; s++){
      const u = s/40;
      const yy = horizonY + (H - horizonY)*Math.pow(u, 1.5)*0.96;
      const xx = W/2 + meandro(u);
      s ? x.lineTo(xx, yy) : x.moveTo(xx, yy);
    }
    x.strokeStyle = hex(PRACTICA, alfa);
    x.lineWidth = ancho * (0.5 + 0.9);   // el grosor medio; la perspectiva la da el halo
    x.stroke();
  }
  // afluentes tenues: caminos menores que buscan el principal
  for (const [x0, curva, alfa] of [[-0.22, 0.6, 0.10], [0.18, -0.5, 0.09], [-0.09, 0.35, 0.07], [0.30, -0.8, 0.06]]){
    x.beginPath();
    for (let s = 0; s <= 24; s++){
      const u = s/24;
      const yy = horizonY + (H - horizonY)*Math.pow(u, 1.4)*0.7;
      const xx = W/2 + x0*W*(1-u) + meandro(u)*u + curva*W*0.05*u*(1-u);
      s ? x.lineTo(xx, yy) : x.moveTo(xx, yy);
    }
    x.strokeStyle = hex(PRACTICA, alfa);
    x.lineWidth = 1.1;
    x.stroke();
  }

  // el destello donde el camino toca el horizonte
  const focoR = Math.min(W*0.17, H*0.19);
  const foco = x.createRadialGradient(W/2, horizonY, 1, W/2, horizonY, focoR);
  foco.addColorStop(0, hex(MARFIL, 0.5));
  foco.addColorStop(0.3, hex(PRACTICA, 0.28));
  foco.addColorStop(1, hex(PRACTICA, 0));
  x.fillStyle = foco; x.beginPath(); x.arc(W/2, horizonY, focoR, 0, 7); x.fill();

  paisaje = c;
}

/* --- el emblema: geometría LITERAL del SVG congelado ----------------------- */
const EMBLEMA = {
  orbita:    {cx:30, cy:30, r:27},
  triangulo: new Path2D("M30 12 L47 44 L13 44 Z"),
  espiral:   new Path2D("M30 38 a7 7 0 1 1 7 -7 a4.5 4.5 0 1 0 -4.5 4.5 a2.5 2.5 0 1 1 -2.5 -2.5"),
};

/* El núcleo: emblema + órbitas con satélites — energía contenida, no fuegos */
function nucleo(t, esc){
  // con una rama en foco el emblema cede el protagonismo a la constelación
  const lado = R * (RAMA !== null ? 0.40 : SOLO ? 0.62 : 0.56) * esc, k = lado / 60;
  g.save(); g.translate(cx, cy);

  // zona de respeto (§63): la malla se apaga debajo, no se tapa con un parche
  const halo = lado * 1.18;
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, halo);
  gr.addColorStop(0,    hex(COSMOS,   0.42));
  gr.addColorStop(0.5,  hex(COSMOS,   0.16));
  gr.addColorStop(1,    hex(COSMOS,   0));
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, halo, 0, 7); g.fill();

  const luz = g.createRadialGradient(0, 0, 0, 0, 0, halo);
  luz.addColorStop(0,    hex(MARFIL,   0.30));
  luz.addColorStop(0.30, hex(PRACTICA, 0.20));
  luz.addColorStop(0.62, hex(PRACTICA, 0.05));
  luz.addColorStop(1,    hex(PRACTICA, 0));
  g.fillStyle = luz; g.beginPath(); g.arc(0, 0, halo, 0, 7); g.fill();

  // DOS órbitas elípticas con satélites lentos: el núcleo respira energía
  g.globalCompositeOperation = "lighter";
  for (const [rx, ry, rot, fase, vel] of [
    [lado*0.86, lado*0.30, -0.42, 0,   0.05],
    [lado*1.06, lado*0.40,  0.52, 2.1, -0.034],
  ]){
    g.save(); g.rotate(rot);
    g.strokeStyle = hex(PRACTICA, 0.16); g.lineWidth = 0.8;
    g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, 7); g.stroke();
    const a = (QUIETO ? fase : t*vel*Math.PI*2 + fase);
    const sx = Math.cos(a)*rx, sy = Math.sin(a)*ry;
    const sp = hacerSprite(PRACTICA, 2.2);
    g.globalAlpha = 0.85;
    g.drawImage(sp, sx - sp.width/2, sy - sp.height/2);
    g.globalAlpha = 1;
    g.restore();
  }
  g.globalCompositeOperation = "source-over";

  g.translate(-lado/2, -lado/2); g.scale(k, k);
  g.lineCap = "round"; g.lineJoin = "round";
  // trazo doble: primero el cuerpo de luz, ancho y tenue; encima el filo vivo.
  // Es el bloom del emblema sin shadowBlur, que en móvil cuesta cuadros.
  g.strokeStyle = hex(PRACTICA, 0.30);
  g.lineWidth = 5.5;
  g.globalAlpha = 0.72;
  g.beginPath(); g.arc(EMBLEMA.orbita.cx, EMBLEMA.orbita.cy, EMBLEMA.orbita.r, 0, 7); g.stroke();
  g.globalAlpha = 1;
  g.stroke(EMBLEMA.triangulo);
  g.stroke(EMBLEMA.espiral);
  g.strokeStyle = hex(PRACTICA, 0.98);
  g.lineWidth = 2.2;
  g.globalAlpha = 0.78;
  g.beginPath(); g.arc(EMBLEMA.orbita.cx, EMBLEMA.orbita.cy, EMBLEMA.orbita.r, 0, 7); g.stroke();
  g.globalAlpha = 1;
  g.stroke(EMBLEMA.triangulo);
  g.lineWidth = 1.9;
  g.stroke(EMBLEMA.espiral);
  g.restore();
}

/* --- fichas de rama: DOM nítido, asiento orgánico, dos órbitas ------------- */
function pintarRamas(){
  const cont = document.getElementById("ramas");
  cont.innerHTML = "";
  if (FONDO_PURO){ AREAS.forEach(a => { a.el = null; }); return; }
  AREAS.forEach(a => {
    const el = document.createElement("div");
    el.className = "rama " + a.f + " " + a.jer;
    el.setAttribute("role", "listitem");
    // la etiqueta se parte sola si es larga; nunca se trunca
    const nombre = a.n === "Contrataciones con el Estado"
      ? "Contrataciones<br>con el Estado" : a.n;
    el.innerHTML =
      `<span class="aro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true">${ICONOS[a.icon]}</svg></span><b>${nombre}</b><small class="peso">${CIFRAS[a.icon] || ""}</small>`;
    cont.appendChild(el);
    a.el = el;
    el.addEventListener("click", () => fijarRama(AREAS.indexOf(a)));
  });
}

/* la rama en foco: las demás fichas se retiran; tocar la activa o la
   pastilla devuelve la constelación completa */
function fijarRama(ix){
  RAMA = (RAMA === ix) ? null : ix;
  aplicarFiltro();
  medir();                     // la constelación se reconstruye para la rama
}
function aplicarFiltro(){
  if (FONDO_PURO) return;
  AREAS.forEach((a, i) => {
    a.el.classList.toggle("oculta", RAMA !== null && i !== RAMA);
    a.el.classList.toggle("activa", RAMA === i);
  });
  const pastilla = document.getElementById("volverRama");
  if (pastilla){
    pastilla.classList.toggle("visible", RAMA !== null);
    if (RAMA !== null) pastilla.querySelector("b").textContent = AREAS[RAMA].n;
  }
  if (typeof cuadroQuieto === "function") cuadroQuieto();   /* P0.3: re-render quieto */
}

/* Asientos: alrededor de la esfera, en el ángulo del slot, con radio según
   órbita y un vaivén mínimo por nodo — posiciones VARIABLES, no una rueda.
   El desorden es determinista (por índice), no aleatorio por cuadro. */
function sentarRamas(t){
  const Rs = R * FOCO / Math.sqrt(FOCO*FOCO - 1);
  AREAS.forEach((a, i) => {
    const orb = a.slot.o === 1 ? 1.30 : 1.52;
    // el desahogo: el ángulo respira unos grados, cada rama con su fase
    // (P3B orden 9: en SAFE el vaivén se atenúa — movimiento secundario)
    const mov = (typeof RENDER !== "undefined") ? RENDER.ajustes().movimiento : 1;
    const vaiven = QUIETO ? 0 : Math.sin(t*0.10 + i*2.3) * 0.022 * mov;
    const ang = (a.slot.a * Math.PI/180) + (i%2 ? 0.05 : -0.04) + vaiven;
    // elipse: en pantallas estrechas el anillo se aplasta a lo alto
    const ex = Math.min(Rs*orb, W*0.5 - 62);
    const ey = Rs * orb * 0.98;
    let X = cx + Math.cos(ang)*ex;
    let Y = cy + Math.sin(ang)*ey * (a.slot.o === 1 ? 1 : 1.02);
    X = Math.max(56, Math.min(W - 56, X));
    Y = SOLO ? Math.max(H*0.06, Math.min(H*0.92, Y)) : Math.max(H*0.16, Math.min(H*0.66, Y));
    if (RAMA === i){          // la rama en foco preside desde lo alto
      X = W/2;
      Y = SOLO ? H*0.085 : H*0.13;
    }
    if (a.el){ a.el.style.left = X + "px"; a.el.style.top = Y + "px"; }
    a.X = X; a.Y = Y;
  });
}

/* --- interacción: la red se enciende alrededor del dedo, sin rebotes ------- */
let dedo = null, ondas = [];
addEventListener("pointermove", e => { dedo = {x:e.clientX, y:e.clientY}; }, {passive:true});
addEventListener("pointerleave", () => { dedo = null; });
addEventListener("pointerdown", e => {
  ondas.push({x:e.clientX, y:e.clientY, t0:performance.now()/1000});
  if (ondas.length > 3) ondas.shift();
}, {passive:true});

/* --- medición y disposición ------------------------------------------------
   P3B: la vieja escalera local (calidad 1/0.6/0.35 sin recuperación) queda
   retirada — el tier lo decide la Render Policy con histéresis, y aquí
   solo se APLICA en el orden de degradación aprobado. */
function medir(){
  dpr = Math.min(devicePixelRatio || 1, RENDER.ajustes().dpr);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W/2;
  // la esfera DOMINA el tramo entre identidad y manifiesto — es la portada
  cy = SOLO ? H*0.50 : H * (H > W ? 0.385 : 0.44);
  R  = SOLO ? Math.min(W*0.325, H*0.30) : Math.min(W*0.36, H*0.23);
  FOCO = 3.1;
  horizonY = SOLO ? H * 1.6 : H * 0.78;   // en modo solo, vacío puro
  // el manifiesto se asienta entre la esfera y el horizonte
  const man = document.getElementById("manifiesto");
  man.style.top = Math.min(H*0.72, cy + R*2.15) + "px";
  sembrarCielo(); construir(); hacerPaisaje(); sentarRamas(0);
  if (typeof cuadroQuieto === "function") cuadroQuieto();   /* P0.3: re-render quieto */
}

/* --- el cuadro ------------------------------------------------------------- */
const VUELTA = 110;                    // segundos por vuelta: deriva, no rotación
/* P3B (REN5): tiempo de animación = tiempo VISIBLE acumulado. Con la
   pestaña oculta el organismo no envejece; al volver, cero salto de fase. */
let tAnim = 0, ultimo = 0, vivo = true;

/* P3B · cambio de DPR en boundary seguro: al transitar de tier, el lienzo se
   re-dimensiona SIN re-sembrar la constelación (las coordenadas son
   normalizadas — cero pop de geometría); solo el paisaje se re-renderiza. */
RENDER.alCambio(aj => {
  const nd = Math.min(devicePixelRatio || 1, aj.dpr);
  if (Math.abs(nd - dpr) < 0.01) return;
  dpr = nd;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  hacerPaisaje();
  cuadroQuieto();
});

function cuadro(ahora){
  if (!vivo) return;
  const dt = Math.min(64, ahora - (ultimo || ahora)); ultimo = ahora;
  const AJ = RENDER.ajustes();        // los mandos del tier vivo (objeto cacheado)

  tAnim += dt / 1000;
  const t = QUIETO ? 7.5 : tAnim;
  const esc = 1 + (QUIETO ? 0 : 0.012 * AJ.movimiento * Math.sin(t * Math.PI*2 / RESPIRA));
  const ang = QUIETO ? 0.35 : t / VUELTA * Math.PI * 2;
  const cs = Math.cos(ang), sn = Math.sin(ang);

  g.fillStyle = COSMOS; g.fillRect(0, 0, W, H);

  // el cielo: estrellas en tres planos — P3B orden 3: el titileo de las
  // estrellas SECUNDARIAS (plano 0/1) baja de frecuencia por tier; las
  // primarias (plano 2) titilan siempre. Nada desaparece: solo respira menos.
  const cadaT = AJ.twinkle >= 1 ? 1 : AJ.twinkle >= 0.7 ? 2 : AJ.twinkle >= 0.45 ? 3 : 5;
  for (let iE = 0; iE < estrellas.length; iE++){
    const e = estrellas[iE];
    const titila = e.plano === 2 || iE % cadaT === 0;
    const par = QUIETO ? 0 : Math.sin(t*0.05*e.vel + e.t) * (e.plano+1) * 1.4;
    const a = e.a * (QUIETO ? 1 : !titila ? 0.87 : 0.75 + 0.25*Math.sin(t*e.vel + e.t));
    g.fillStyle = hex(MARFIL, a);
    g.beginPath(); g.arc(e.x*W + par, e.y*H*0.8, e.r, 0, 7); g.fill();
  }
  // nebulosa de baja intensidad — P3B orden 4: glow secundario cede por tier
  g.globalCompositeOperation = "lighter";
  for (let iN = 0; iN < nebulosa.length; iN++){
    if (AJ.blur < 0.7 && iN % 2) continue;
    const nb = nebulosa[iN];
    const rad = nb.rad * Math.min(W, H);
    const sp = hacerNube(nb.br ? DOCTRINA : PRACTICA, rad);
    const lat = QUIETO ? 1 : 0.8 + 0.2*Math.sin(t*0.13 + nb.t);
    g.globalAlpha = nb.a * lat * (0.6 + 0.4*AJ.blur);
    g.drawImage(sp, nb.x*W - rad, nb.y*H - rad, rad*2, rad*2);
  }
  g.globalAlpha = 1;
  g.globalCompositeOperation = "source-over";

  // ZONA D: el paisaje pre-renderizado y el pulso casi imperceptible del alba
  g.drawImage(paisaje, 0, 0, W, H);
  if (!QUIETO && AJ.halos > 0){
    const lat = 0.5 + 0.5*Math.sin(t * Math.PI*2 / (RESPIRA*2));
    const albaP = Math.min(W*0.3, H*0.34);
    const alba = g.createRadialGradient(W/2, horizonY, 1, W/2, horizonY, albaP);
    alba.addColorStop(0, hex(PRACTICA, 0.05*lat));
    alba.addColorStop(1, hex(PRACTICA, 0));
    g.fillStyle = alba; g.fillRect(0, horizonY - albaP, W, albaP*2);
  }

  // ZONA B: la esfera
  const P = nodos.map(nd => proyecta(nd, cs, sn, esc));

  // decaimiento de la luz de interacción + onda de toque
  const dec = Math.exp(-dt/1000 * 2.4);
  const reach = R * 0.85;
  for (let i = 0; i < nodos.length; i++){
    nodos[i].luz *= dec;
    if (dedo){
      const dx = P[i].X - dedo.x, dy = P[i].Y - dedo.y;
      const q = Math.exp(-(dx*dx + dy*dy) / (reach*reach));
      if (q > nodos[i].luz) nodos[i].luz = q;
    }
  }
  const ahoraS = ahora/1000;
  ondas = ondas.filter(o => ahoraS - o.t0 < 1.6);
  for (const o of ondas){
    const edad = ahoraS - o.t0, rad = edad * R * 2.2, grosor = R*0.3;
    for (let i = 0; i < nodos.length; i++){
      const dx = P[i].X - o.x, dy = P[i].Y - o.y;
      const d = Math.hypot(dx, dy);
      const q = Math.exp(-((d - rad)*(d - rad)) / (grosor*grosor)) * (1 - edad/1.6);
      if (q > nodos[i].luz) nodos[i].luz = q;
    }
  }

  g.globalCompositeOperation = "lighter";

  // LUZ INTERIOR: un pecho de luz tenue en el corazón de la esfera — es lo
  // que hace que la red se lea como un organismo encendido y no como puntos
  // sueltos sobre negro. Un solo foco dominante: este.
  {
    const rIn = R * 1.05;
    const seno = g.createRadialGradient(cx, cy, 0, cx, cy, rIn);
    seno.addColorStop(0,    hex(MARFIL,   0.20));
    seno.addColorStop(0.35, hex(PRACTICA, 0.105));
    seno.addColorStop(0.7,  hex(PRACTICA, 0.036));
    seno.addColorStop(1,    hex(PRACTICA, 0));
    g.fillStyle = seno;
    g.beginPath(); g.arc(cx, cy, rIn, 0, 7); g.fill();
  }

  // el gas — P3B orden 4: parte del glow interior cede por tier
  const saltoGas = AJ.glow >= 1 ? 1 : AJ.glow >= 0.6 ? 2 : 3;
  for (let iG = 0; iG < gas.length; iG++){
    if (iG % saltoGas) continue;
    const b = gas[iG];
    const p = proyecta(b, cs, sn, esc);
    const rad = b.rad * R * (0.7 + 0.6*p.prof);
    const sp = hacerNube(b.br ? DOCTRINA : PRACTICA, rad);
    const lat = QUIETO ? 1 : 0.75 + 0.25*Math.sin(t*0.22 + b.t);
    g.globalAlpha = b.a * (SOLO ? 2.1 : 1.4) * (0.35 + 0.65*p.prof) * lat;
    g.drawImage(sp, p.X - rad, p.Y - rad, rad*2, rad*2);
  }
  g.globalAlpha = 1;

  // el polvo — P3B orden 2: la densidad de partículas la fija el tier
  const saltoPolvo = Math.max(1, Math.round(1 / Math.max(0.25, AJ.particulas)));
  for (let i = 0; i < polvo.length; i += saltoPolvo){
    const d = polvo[i];
    const p = proyecta(d, cs, sn, esc);
    const par = QUIETO ? 1 : 0.7 + 0.3*Math.sin(t*0.4 + d.t);
    g.fillStyle = hex(d.br ? DOCTRINA : PRACTICA, d.a * (0.15 + 1.0*p.prof) * par);
    g.fillRect(p.X - 0.6, p.Y - 0.6, 1.2, 1.2);
  }

  // las diagonales internas: cuerdas tenues por DENTRO del volumen
  // P3B orden 5: son decorativas — una fracción cede por tier (determinista)
  for (let iD = 0; iD < diagonales.length; iD++){
    if (iD % 10 >= AJ.aristas * 10) continue;
    const dg = diagonales[iD];
    if (!nodoEnFoco(dg.i) || !nodoEnFoco(dg.j)) continue;
    const A = P[dg.i], B = P[dg.j];
    const prof = (A.prof + B.prof)/2;
    const mx = (A.X + B.X)/2 + (cx - (A.X + B.X)/2)*0.24;
    const my = (A.Y + B.Y)/2 + (cy - (A.Y + B.Y)/2)*0.24;
    const luz = Math.max(nodos[dg.i].luz, nodos[dg.j].luz);
    g.strokeStyle = hex(nodos[dg.i].br ? DOCTRINA : PRACTICA,
                        (0.045 + 0.09*prof) * (1 + luz*1.4));
    g.lineWidth = 0.55 + 0.3*prof;
    g.beginPath(); g.moveTo(A.X, A.Y); g.quadraticCurveTo(mx, my, B.X, B.Y); g.stroke();
  }

  // las aristas, de atrás hacia delante; las largas se curvan SOBRE la esfera
  const orden = aristas.map((a, k) => [ (P[a.i].prof + P[a.j].prof)/2, k ])
                       .sort((a, b) => a[0]-b[0]);
  for (const [prof, k] of orden){
    const a = aristas[k], A = P[a.i], B = P[a.j];
    if (!nodoEnFoco(a.i) || !nodoEnFoco(a.j)) continue;
    const luz = Math.max(nodos[a.i].luz, nodos[a.j].luz);
    // P3B orden 5: los PUENTES curvos (decorativos) ceden una fracción por
    // tier; el esqueleto de vecinos y los CRUCES DE DOMINIO (§59) jamás.
    // Una arista encendida por el dedo tampoco cede: el estado de
    // interacción no se degrada.
    if (!a.cruza && a.curva && luz < 0.05 && k % 10 >= AJ.aristas * 10) continue;
    if (a.cruza){
      const p = QUIETO ? 0.7 : 0.45 + 0.55*Math.pow(0.5+0.5*Math.sin(t*0.8 + a.i), 2);
      const lg = g.createLinearGradient(A.X, A.Y, B.X, B.Y);
      lg.addColorStop(0,   hex(PRACTICA, Math.min(1, 0.55*p*prof*(1+luz))));
      lg.addColorStop(0.5, hex(MARFIL,   Math.min(1, 0.46*p*prof*(1+luz))));
      lg.addColorStop(1,   hex(DOCTRINA, Math.min(1, 0.55*p*prof*(1+luz))));
      g.strokeStyle = lg; g.lineWidth = 0.75 + 0.45*prof + luz*0.5;
    } else if (RAMA !== null){
      // modo rama: la cuerda es joya — gradiente del color de familia con
      // corazón de marfil, más luminosa que en el mapa coral
      const col = nodos[a.i].br ? DOCTRINA : PRACTICA;
      const alfa = Math.min(1, (0.24 + 0.5*prof) * (0.5 + 0.5*prof) * (1 + luz*2.2));
      const lg = g.createLinearGradient(A.X, A.Y, B.X, B.Y);
      lg.addColorStop(0,   hex(col,    alfa));
      lg.addColorStop(0.5, hex(MARFIL, alfa*0.8));
      lg.addColorStop(1,   hex(col,    alfa));
      g.strokeStyle = lg;
      g.lineWidth = 0.75 + 0.5*prof + luz*0.45;
    } else {
      g.strokeStyle = hex(nodos[a.i].br ? DOCTRINA : PRACTICA,
                          Math.min(1, (0.17 + 0.42*prof) * (0.42 + 0.58*prof) * (1 + luz*2.2)));
      g.lineWidth = 0.6 + 0.45*prof + luz*0.4;
    }
    if (a.curva){
      // la cuerda sigue la superficie: el punto de control se empuja
      // radialmente hacia fuera desde el centro proyectado
      const mx = (A.X + B.X)/2, my = (A.Y + B.Y)/2;
      const vx = mx - cx, vy = my - cy;
      const n = Math.hypot(vx, vy) || 1;
      const em = 1 + 0.10 * Math.min(1, Math.hypot(A.X-B.X, A.Y-B.Y)/(R*1.2));
      g.beginPath(); g.moveTo(A.X, A.Y);
      g.quadraticCurveTo(cx + vx/n*n*em, cy + vy/n*n*em, B.X, B.Y);
      g.stroke();
    } else {
      g.beginPath(); g.moveTo(A.X, A.Y); g.lineTo(B.X, B.Y); g.stroke();
    }
  }

  // los nodos, de atrás hacia delante
  const ordenN = P.map((p, k) => [p.prof, k]).sort((a, b) => a[0]-b[0]);
  for (const [prof, k] of ordenN){
    if (!nodoEnFoco(k)) continue;
    const nd = nodos[k], p = P[k];
    // P3B orden 6: SOLO el relleno interior sin papel de grafo (s=0, dentro)
    // cede una fracción en SAFE — es representación, no información. Los
    // nodos luminosos, la cáscara y todo nodo encendido por el dedo quedan.
    if (nd.s === 0 && nd.dentro && nd.luz < 0.05 && k % 10 >= AJ.nodos * 10) continue;
    const col = nd.br ? DOCTRINA : PRACTICA;
    const rad = [2.1, 3.8, 6.6][nd.s] * (0.45 + 0.75*prof) * (R/230) * (1 + nd.luz*0.6);
    const br  = QUIETO ? 0.8 : 0.66 + 0.34*Math.sin(t*0.5 + nd.f);
    const sp  = hacerSprite(col, rad);
    const aN = Math.min(1, (0.30 + 0.70*prof*prof) * (0.62 + 0.38*br) + nd.luz*0.5);
    // bloom: un halo ancho y muy tenue debajo del punto — luz que respira,
    // no neón. Solo en los nodos luminosos, que son los que el gate cuenta.
    // P3B orden 4: el bloom de los nodos de tamaño 1 cede por tier; los
    // grandes (s=2) lo conservan mientras quede algo de glow — identidad.
    if (nd.s > 0 && prof > 0.3 && (nd.s === 2 ? AJ.glow > 0.15 : AJ.glow >= 0.6)){
      const rh = rad * 3.2;
      const hb = hacerNube(col, rh);
      g.globalAlpha = aN * (SOLO ? 0.36 : 0.22) * Math.max(0.6, AJ.glow);
      g.drawImage(hb, p.X - rh, p.Y - rh, rh*2, rh*2);
    }
    g.globalAlpha = aN;
    g.drawImage(sp, p.X - sp.width/2, p.Y - sp.height/2);
    // los grandes llevan destello de cuatro puntas: estrella, no lunar
    if (nd.s === 2 && prof > 0.45){
      const L = rad * 2.6, aD = g.globalAlpha * 0.55;
      g.globalAlpha = aD;
      g.strokeStyle = hex(MARFIL, 0.85); g.lineWidth = 0.7;
      g.beginPath();
      g.moveTo(p.X - L, p.Y); g.lineTo(p.X + L, p.Y);
      g.moveTo(p.X, p.Y - L); g.lineTo(p.X, p.Y + L);
      g.stroke();
    }
  }

  // el limbo: el borde de la esfera brilla porque ahí hay más materia
  // P3B orden 8: postprocesado — cede por tier y desaparece solo en SAFE
  const Rs = R * FOCO / Math.sqrt(FOCO*FOCO - 1) * esc;
  if (AJ.halos > 0){
    const lim = g.createRadialGradient(cx, cy, Rs*0.88, cx, cy, Rs*1.10);
    lim.addColorStop(0,    hex(PRACTICA, 0));
    lim.addColorStop(0.55, hex(PRACTICA, 0.026*AJ.halos));
    lim.addColorStop(0.78, hex(MARFIL,   0.022*AJ.halos));
    lim.addColorStop(1,    hex(PRACTICA, 0));
    g.fillStyle = lim;
    g.beginPath(); g.arc(cx, cy, Rs*1.10, 0, 7); g.fill();
  }

  // anillos orbitales: dos elipses finas ciñen la esfera — cartografía, no
  // adorno decorativo: se conservan en todos los tiers (orientación)
  g.save(); g.translate(cx, cy);
  for (const [rk, ry, rot, al] of [[1.14, 0.36, -0.20, SOLO?0.32:0.20], [1.30, 0.30, 0.14, SOLO?0.19:0.11]]){
    g.rotate(rot);
    g.strokeStyle = hex(PRACTICA, al); g.lineWidth = 0.7;
    g.setLineDash([1, 5]);
    g.beginPath(); g.ellipse(0, 0, Rs*rk, Rs*rk*ry, 0, 0, 7); g.stroke();
    g.setLineDash([]);
    g.rotate(-rot);
  }
  g.restore();

  g.globalAlpha = 1;
  g.globalCompositeOperation = "source-over";

  // los hilos de rama: cada ficha cosida a sus nodos con puntadas discontinuas
  g.setLineDash([2, 4]);
  AREAS.forEach((a, ia) => {
    if (RAMA !== null && ia !== RAMA) return;
    const pa = proyecta(a.ancla, cs, sn, esc);
    for (const i of a.puntadas){
      const p = P[i];
      if (p.prof < 0.55) continue;              // no se cose a lo que no se ve
      if (Math.hypot(p.X - a.X, p.Y - a.Y) > R * 1.15) continue; // ni a lo lejano
      g.strokeStyle = hex(a.f === "p" ? PRACTICA : DOCTRINA, 0.16 + 0.26*p.prof);
      g.lineWidth = 0.9;
      g.beginPath(); g.moveTo(a.X, a.Y); g.lineTo(p.X, p.Y); g.stroke();
    }
  });
  g.setLineDash([]);

  nucleo(t, esc);
  sentarRamas(t);

  /* P0.3 (AV-P0P1-EXEC-001): bajo prefers-reduced-motion el organismo posa
     quieto — un solo cuadro por estado; el bucle no consume batería. */
  if (!QUIETO) requestAnimationFrame(cuadro);
}
function cuadroQuieto(){ if (QUIETO){ ultimo = 0; requestAnimationFrame(cuadro); } }

/* pausa cuando la pestaña no está visible: cero trabajo en segundo plano */
document.addEventListener("visibilitychange", () => {
  if (document.hidden){ vivo = false; }
  else if (!vivo){ vivo = true; ultimo = 0; requestAnimationFrame(cuadro); }
});

addEventListener("resize", medir);
{
  const pastilla = document.createElement("button");
  pastilla.id = "volverRama"; pastilla.type = "button";
  pastilla.innerHTML = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5.5 L8.5 12 L15 18.5"/></svg><b></b><span>· todas las áreas</span>';
  pastilla.addEventListener("click", () => fijarRama(RAMA));
  document.body.appendChild(pastilla);
}
pintarRamas();
aplicarFiltro();
medir();
requestAnimationFrame(cuadro);
</script>
