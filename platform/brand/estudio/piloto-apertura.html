<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden}
.pantalla{height:100dvh;position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;text-align:center;
  padding:max(18px,env(safe-area-inset-top)) 26px 0}
.fecha{margin-top:1.5dvh}

/* el emblema con su destello, como la portada */
.sello{position:relative;margin-top:11dvh; /* AV-P3A1: escala/halo desde la capa de lanzamiento (cine.css); con los valores por defecto la geometría es EXACTA a la aprobada */
  width:calc(clamp(104px,17dvh,142px) * var(--lanzamiento-logo-escala,1));
  height:calc(clamp(104px,17dvh,142px) * var(--lanzamiento-logo-escala,1))}
.sello svg{width:100%;height:100%;color:var(--gold);
  filter:drop-shadow(0 0 14px color-mix(in srgb, var(--gold) calc(55% * var(--lanzamiento-halo,1)), transparent))
         drop-shadow(0 0 40px color-mix(in srgb, var(--gold) calc(22% * var(--lanzamiento-halo,1)), transparent))}
.sello .astro{position:absolute;left:50%;top:2%;width:26px;height:26px;
  transform:translate(-50%,-50%);
  background:
    linear-gradient(0deg,  transparent 46%, color-mix(in srgb, var(--athenea-marfil) 85%, transparent) 50%, transparent 54%),
    linear-gradient(90deg, transparent 46%, color-mix(in srgb, var(--athenea-marfil) 85%, transparent) 50%, transparent 54%),
    radial-gradient(circle, color-mix(in srgb, var(--athenea-marfil) 95%, transparent) 0 12%,
      color-mix(in srgb, var(--gold) 60%, transparent) 24%, transparent 60%);
  animation:astro 14s var(--curva-organica) infinite}
@keyframes astro{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.9)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
@media (prefers-reduced-motion: reduce){ .sello .astro{animation:none} }
/* AV-P3A1 FASE 3: el arranque revela la apertura desde el telón obsidiana —
   una sola experiencia desde el primer píxel. Gobernado por la capa de
   lanzamiento; con movimiento reducido no existe. */
@media (prefers-reduced-motion: no-preference){
  .pantalla{animation:lanzamiento-revela var(--lanzamiento-duracion,480ms) var(--curva-entrada) both}
  @keyframes lanzamiento-revela{from{opacity:0}}
}

.marca{margin-top:3.4dvh;
  font:var(--peso-normal) clamp(30px,5.6dvh,44px)/1 "Cinzel",var(--fuente-lectura);
  letter-spacing:.30em;text-indent:.30em;
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--athenea-marfil) 96%, var(--gold)),
    color-mix(in srgb, var(--athenea-marfil) 60%, var(--athenea-atenuado)) 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.live{margin-top:1.4dvh;font:var(--peso-medio) clamp(12px,1.9dvh,15px)/1 "Cinzel",var(--fuente-lectura);
  letter-spacing:.62em;text-indent:.62em;color:var(--gold)}
.promesa{margin-top:2dvh;font-size:clamp(11px,1.4dvh,12px); /* P0.1: piso legible */
  letter-spacing:.24em;text-indent:.24em;color:var(--gold);
  text-transform:uppercase;opacity:.92;white-space:nowrap}
.cita{margin-top:3.8dvh;max-width:30ch;
  font:italic var(--peso-normal) clamp(14px,2.2dvh,18px)/1.6 "Playfair Display",var(--fuente-lectura);
  color:var(--athenea-marfil)}
.entrar{margin-top:2.9dvh;position:relative;z-index:1;
  color:color-mix(in srgb, var(--athenea-marfil) 45%, var(--gold));
  background:color-mix(in srgb, var(--athenea-cosmos) 62%, transparent);
  border-color:color-mix(in srgb, var(--gold) 68%, transparent);
  box-shadow:0 0 14px color-mix(in srgb, var(--gold) 18%, transparent)}
/* velo obsidiana LOCAL tras la zona del CTA: funde la foto sin encajonarla
   ni apagar el planeta — solo calma las luces urbanas bajo el texto */
.entrar::before{content:"";position:absolute;z-index:-1;
  left:50%;top:50%;width:min(270%,88vw);height:340%;transform:translate(-50%,-46%);
  background:radial-gradient(48% 46% at 50% 52%,
    color-mix(in srgb, var(--athenea-cosmos) 72%, transparent) 0 38%,
    color-mix(in srgb, var(--athenea-cosmos) 38%, transparent) 62%,
    transparent 78%);
  pointer-events:none}

/* el planeta REAL despierta abajo: fotografía anclada al borde inferior,
   fundida con el cosmos por una máscara superior progresiva. Sin haz
   geométrico, sin halos sintéticos: el alba viene dentro de la imagen. */
.horizonte{position:absolute;left:0;right:0;bottom:0;height:22.7dvh;
  overflow:hidden;background:var(--athenea-cosmos);
  -webkit-mask-image:linear-gradient(180deg, transparent, #000 38%);
  mask-image:linear-gradient(180deg, transparent, #000 38%)}
.horizonte img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:50% 30%;display:block}
/* Pantallas bajas: la columna ceremonial se compacta para que el botón
   respire claramente por encima del limbo. */
@media (max-height:620px){
  .sello{margin-top:7.5dvh;width:clamp(88px,15dvh,104px);height:clamp(88px,15dvh,104px)}
  .marca{margin-top:2.6dvh}
  .cita{margin-top:2.8dvh}
  .entrar{margin-top:2.6dvh}
  .horizonte{height:24dvh}
}
/* En marcos anchos el recorte cover dejaría solo la superficie: se centra
   la ventana en el limbo para que la curvatura y el alba presidan. */
@media (min-width:768px){
  .horizonte{height:25dvh}
  .horizonte img{object-position:50% 24%}
}
/* BOTÓN FONDO VIVO (orden del Director, 2026-08-16): acceso de un toque
