<style>/* AV-P3A1-LAUNCH-001: guardia de primer pintado — obsidiana antes de que exista cualquier hoja de estilo (valor compilado de --lanzamiento-fondo, cine.css) */html{background:#05060e}</style>

<link rel="icon" type="image/png" href="../iconos/athenea-icono-192.png">

<link rel="stylesheet" href="../cine.css">
<script src="../gramatica-sensorial.mjs"></script><!-- P3C AV-P3C-SENSORY-001: gramática sensorial — clásico en head: la anotación llega antes del primer fotograma --><!-- P3A AV-P3A-CINE-001: capa cinematográfica (continuidad entre escenas) -->
<title>ATHENEA · Fondo Vivo</title>
<meta name="athenea-alcance" content="interno">
<!--
  FONDO VIVO (orden del Director, 2026-08-16): el wallpaper de la casa
  dentro de la app nueva. El cosmos del núcleo vivo a pantalla completa
  —modo ?fondo del motor único: sin fichas, sin pastilla, solo el
  organismo— con controles mínimos que se retiran solos.
-->
<link rel="stylesheet" href="../fuentes/fuentes.css">
<style>
*{box-sizing:border-box}
:root{ /* P1.3: tokens desde athenea-theme.css */
  --fuente-editorial:"Playfair Display",var(--fuente-lectura)}
html,body{height:100%}
html{background:var(--athenea-abismo)}
body{margin:0;overflow:hidden}
#cosmos{position:fixed;inset:0;width:100%;height:100%;border:0}
/* controles: presentes al entrar, se desvanecen solos; un toque los trae */
#velo{position:fixed;inset:0;pointer-events:none;z-index:2;
  transition:opacity .8s ease;display:flex;flex-direction:column;
  justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 18px
  calc(18px + env(safe-area-inset-bottom))}
#velo.dormido{opacity:0}
#velo .arriba{display:flex;align-items:center;justify-content:space-between}
#velo a.volver{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;min-height:44px; /* P0.2 */
  font:600 11px/1 "Inter",var(--fuente-interfaz);letter-spacing:.2em;
  text-transform:uppercase;color:#c9c4d4;text-decoration:none;
  padding:8px 13px;border-radius:999px;
  border:1px solid rgba(244,230,190,.18);background:rgba(8,10,24,.55);
  backdrop-filter:blur(6px)}
#velo a.volver svg{width:11px;height:11px}
#velo .marca{font:500 11px/1 "Inter",var(--fuente-interfaz);letter-spacing:.3em;
  text-transform:uppercase;color:var(--gold);text-shadow:0 1px 8px rgba(2,4,10,.8)}
#velo .abajo{display:flex;flex-direction:column;align-items:center;gap:10px}
#lienzo{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;min-height:44px; /* P0.2 */
  font:600 11px/1 "Inter",var(--fuente-interfaz);letter-spacing:.22em;
  text-transform:uppercase;color:#05060e;cursor:pointer;
  padding:12px 22px;border-radius:999px;border:0;
  background:linear-gradient(160deg,#f7e7bb,#f0c96a 55%,#c69a3c);
  box-shadow:0 6px 22px rgba(240,201,106,.28)}
#lienzo svg{width:12px;height:12px}
#velo .nota{font:400 11px/1.6 "Inter",var(--fuente-interfaz);letter-spacing:.08em;
  color:#8b90a8;text-align:center;max-width:300px;
  text-shadow:0 1px 8px rgba(2,4,10,.9)}
#velo .nota b{color:#c9c4d4;font-weight:600}
</style>

<iframe id="cosmos" src="hero-nucleo-vivo.html?solo&fondo" title="Fondo vivo de ATHENEA"></iframe>

<div id="velo">
  <div class="arriba">
    <a class="volver" href="piloto-home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5.5 L8.5 12 L15 18.5"/></svg>Home</a>
    <span class="marca">Fondo vivo</span>
  </div>
  <div class="abajo">
    <button id="lienzo" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9 V4 H9 M15 4 H20 V9 M20 15 V20 H15 M9 20 H4 V15"/></svg>
      Pantalla completa
    </button>
    <p class="nota">El cosmos del Cerebro, siempre vivo. Un toque muestra u
    oculta los controles. <b>Para llevarlo de fondo real del teléfono</b>,
    el APK de ATHENEA lo instala como wallpaper del dispositivo.</p>
  </div>
</div>

<script>
const velo = document.getElementById("velo");
let reloj = setTimeout(() => velo.classList.add("dormido"), 3800);
function despertar(){
  velo.classList.toggle("dormido");
  clearTimeout(reloj);
  if (!velo.classList.contains("dormido"))
    reloj = setTimeout(() => velo.classList.add("dormido"), 3800);
}
/* el toque llega por el marco (el iframe come los eventos del fondo):
   se escucha en la ventana y también un puente simple sobre el velo */
addEventListener("pointerdown", despertar);
document.getElementById("lienzo").addEventListener("click", e => {
  e.stopPropagation();
  const raiz = document.documentElement;
  if (!document.fullscreenElement && raiz.requestFullscreen) raiz.requestFullscreen();
  else if (document.exitFullscreen) document.exitFullscreen();
});
</script>
<script>/* AV-P2B2-SW-001: registro del service worker versionado (transporte, no diseño) */
if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
  addEventListener("load", () => {
    navigator.serviceWorker.register(new URL("../../../sw.js", location.href).pathname).catch(() => {});
  });
</script>
</html>
